<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="Tang Nano 9K system: host PC over USB UART into the GW1NR-9 FPGA, the blocks inside it, their memory and the pins, with measured utilisation" font-family="IBM Plex Sans, system-ui, sans-serif">
<style>
svg{--bg:#faf9f6;--ink:#1d2329;--mut:#66707a;--line:#8f99a3;--warm:#c4501d;--warmf:#fbe5d8;
--cool:#16708a;--coolf:#dbeef3;--ok:#2c8a4b;--okf:#ddf0e3;--bad:#b9b5ac;--badf:#efede8;--panel:#f1efea}
@media (prefers-color-scheme:dark){svg{--bg:#14181c;--ink:#e5e8eb;--mut:#9aa4ae;--line:#64707b;
--warm:#f08a5c;--warmf:#3b2418;--cool:#5cc1d9;--coolf:#12303a;--ok:#6dca8b;--okf:#163322;--bad:#6d6a64;
--badf:#24272a;--panel:#1b2025}}

.bg{fill:var(--bg)} .panel{fill:var(--panel)}
.t{fill:var(--ink);font:13px 'IBM Plex Sans',system-ui,sans-serif}
.ts{fill:var(--mut);font:11px 'IBM Plex Sans',system-ui,sans-serif}
.tm{fill:var(--ink);font:11.5px 'IBM Plex Mono',ui-monospace,monospace}
.tms{fill:var(--mut);font:10.5px 'IBM Plex Mono',ui-monospace,monospace}
.th{fill:var(--ink);font:600 15px 'IBM Plex Sans',system-ui,sans-serif}
.tb{fill:var(--ink);font:600 13px 'IBM Plex Sans',system-ui,sans-serif}
.tw{fill:var(--warm)} .tc{fill:var(--cool)} .tok{fill:var(--ok)}
.warm{fill:var(--warmf);stroke:var(--warm);stroke-width:1.4}
.cool{fill:var(--coolf);stroke:var(--cool);stroke-width:1.4}
.ok{fill:var(--okf);stroke:var(--ok);stroke-width:1.4}
.bad{fill:var(--badf);stroke:var(--bad);stroke-width:1.2}
.plain{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.4;fill:none}
.lw{stroke:var(--warm);stroke-width:1.6;fill:none}
.lc{stroke:var(--cool);stroke-width:1.6;fill:none}
.lk{stroke:var(--ink);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:4 4}
.fw{fill:var(--warm)} .fc{fill:var(--cool)} .fk{fill:var(--ink)} .fl{fill:var(--line)}
</style>
<rect width="1100" height="560" class="bg"/>
<text x="24.0" y="32.0" class="th" text-anchor="start" >The thermodynamic computer on the Tang Nano 9K</text>
<text x="24.0" y="52.0" class="ts" text-anchor="start" >Default build (N = 16, maxcut16 at power-on). Measured: LUT4 2534/8640 (29 %), DFF 1293, BSRAM 10/26, 0 DSP, Fmax 62.67 MHz vs 27 MHz needed.</text>
<rect x="24.0" y="110.0" width="140.0" height="70.0" rx="6" class="plain"/>
<text x="94.0" y="142.0" class="tb" text-anchor="middle" >Host PC</text>
<text x="94.0" y="157.0" class="ts" text-anchor="middle" >fpga/host.py</text>
<rect x="200.0" y="80.0" width="880.0" height="450.0" rx="14" class="panel"/>
<text x="216.0" y="102.0" class="ts" text-anchor="start" letter-spacing="1">Tang Nano 9K board</text>
<rect x="216.0" y="116.0" width="120.0" height="60.0" rx="6" class="plain"/>
<text x="276.0" y="143.0" class="tb" text-anchor="middle" >BL702</text>
<text x="276.0" y="158.0" class="ts" text-anchor="middle" >USB ↔ UART</text>
<line x1="164.0" y1="145.0" x2="216.0" y2="145.0" class="lk"/>
<polygon points="216.0,145.0 208.0,149.0 208.0,141.0" class="fk"/>
<text x="190.0" y="138.0" class="ts" text-anchor="middle" >USB-C</text>
<rect x="216.0" y="420.0" width="120.0" height="50.0" rx="6" class="plain"/>
<text x="276.0" y="442.0" class="tb" text-anchor="middle" >27 MHz osc</text>
<text x="276.0" y="457.0" class="ts" text-anchor="middle" >pin 52</text>
<rect x="216.0" y="300.0" width="120.0" height="80.0" rx="6" class="plain"/>
<text x="276.0" y="337.0" class="tb" text-anchor="middle" >buttons</text>
<text x="276.0" y="352.0" class="ts" text-anchor="middle" >pin 4 reset</text>
<text x="276.0" y="365.0" class="ts" text-anchor="middle" >pin 3 run demo</text>
<rect x="360.0" y="112.0" width="700.0" height="400.0" rx="12" class="cool"/>
<text x="376.0" y="134.0" class="tb tc" text-anchor="start" >GW1NR-9 FPGA (rtl/top.v)</text>
<rect x="380.0" y="150.0" width="130.0" height="50.0" rx="6" class="plain"/>
<text x="445.0" y="172.0" class="tb" text-anchor="middle" >uart_rx</text>
<text x="445.0" y="187.0" class="ts" text-anchor="middle" >pin 18, 115200</text>
<rect x="380.0" y="214.0" width="130.0" height="50.0" rx="6" class="plain"/>
<text x="445.0" y="236.0" class="tb" text-anchor="middle" >uart_tx</text>
<text x="445.0" y="251.0" class="ts" text-anchor="middle" >pin 17</text>
<line x1="336.0" y1="140.0" x2="380.0" y2="168.0" class="lk"/>
<polygon points="380.0,168.0 371.1,167.1 375.4,160.3" class="fk"/>
<line x1="380.0" y1="238.0" x2="336.0" y2="156.0" class="lk"/>
<polygon points="336.0,156.0 343.3,161.2 336.3,164.9" class="fk"/>
<rect x="540.0" y="150.0" width="160.0" height="114.0" rx="6" class="plain"/>
<text x="620.0" y="204.0" class="tb" text-anchor="middle" >command FSM</text>
<text x="620.0" y="219.0" class="ts" text-anchor="middle" >W H O T: program</text>
<text x="620.0" y="232.0" class="ts" text-anchor="middle" >B Z: schedule</text>
<text x="620.0" y="245.0" class="ts" text-anchor="middle" >R S: run sweeps</text>
<text x="620.0" y="258.0" class="ts" text-anchor="middle" >D U Q: read out</text>
<line x1="510.0" y1="175.0" x2="540.0" y2="175.0" class="lk"/>
<polygon points="540.0,175.0 532.0,179.0 532.0,171.0" class="fk"/>
<line x1="540.0" y1="238.0" x2="510.0" y2="238.0" class="lk"/>
<polygon points="510.0,238.0 518.0,234.0 518.0,242.0" class="fk"/>
<rect x="380.0" y="290.0" width="470.0" height="200.0" rx="10" class="warm"/>
<text x="394.0" y="310.0" class="tb tw" text-anchor="start" >pbit_array: the sampler</text>
<rect x="394.0" y="322.0" width="130.0" height="54.0" rx="6" class="plain"/>
<text x="459.0" y="346.0" class="tb" text-anchor="middle" >J RAM</text>
<text x="459.0" y="361.0" class="ts" text-anchor="middle" >N×N × 8 bit (1 BSRAM)</text>
<rect x="394.0" y="386.0" width="130.0" height="40.0" rx="6" class="plain"/>
<text x="459.0" y="410.0" class="tb" text-anchor="middle" >h + order RAM</text>
<rect x="540.0" y="322.0" width="150.0" height="104.0" rx="6" class="plain"/>
<text x="615.0" y="371.0" class="tb" text-anchor="middle" >p-bit engine</text>
<text x="615.0" y="386.0" class="ts" text-anchor="middle" >MAC → ×β → σ LUT</text>
<text x="615.0" y="399.0" class="ts" text-anchor="middle" >→ rand &lt; p</text>
<text x="615.0" y="412.0" class="ts" text-anchor="middle" >(1 BSRAM LUT)</text>
<rect x="706.0" y="322.0" width="130.0" height="54.0" rx="6" class="plain"/>
<text x="771.0" y="346.0" class="tb" text-anchor="middle" >spin reg</text>
<text x="771.0" y="361.0" class="ts" text-anchor="middle" >s[0..N−1]</text>
<rect x="540.0" y="436.0" width="150.0" height="44.0" rx="6" class="plain"/>
<text x="615.0" y="455.0" class="tb" text-anchor="middle" >noise_bank</text>
<text x="615.0" y="470.0" class="ts" text-anchor="middle" >4 × LFSR32</text>
<line x1="524.0" y1="349.0" x2="540.0" y2="349.0" class="lk"/>
<polygon points="540.0,349.0 532.0,353.0 532.0,345.0" class="fk"/>
<line x1="524.0" y1="406.0" x2="540.0" y2="406.0" class="lk"/>
<polygon points="540.0,406.0 532.0,410.0 532.0,402.0" class="fk"/>
<line x1="615.0" y1="436.0" x2="615.0" y2="426.0" class="lk"/>
<polygon points="615.0,426.0 619.0,434.0 611.0,434.0" class="fk"/>
<line x1="690.0" y1="349.0" x2="706.0" y2="349.0" class="lk"/>
<polygon points="706.0,349.0 698.0,353.0 698.0,345.0" class="fk"/>
<polyline points="771.0,376.0 771.0,400.0 690.0,400.0" class="lk"/>
<polygon points="690.0,400.0 698.0,396.0 698.0,404.0" class="fk"/>
<rect x="706.0" y="160.0" width="140.0" height="70.0" rx="6" class="plain"/>
<text x="776.0" y="192.0" class="tb" text-anchor="middle" >schedule_ctrl</text>
<text x="776.0" y="207.0" class="ts" text-anchor="middle" >β: const / linear</text>
<text x="776.0" y="220.0" class="ts" text-anchor="middle" >/ table</text>
<line x1="776.0" y1="230.0" x2="776.0" y2="290.0" class="lk"/>
<polygon points="776.0,290.0 772.0,282.0 780.0,282.0" class="fk"/>
<text x="786.0" y="260.0" class="ts" text-anchor="middle" >β</text>
<line x1="620.0" y1="264.0" x2="620.0" y2="290.0" class="lk"/>
<polygon points="620.0,290.0 616.0,282.0 624.0,282.0" class="fk"/>
<text x="676.0" y="281.0" class="ts" text-anchor="middle" >write J, h; run</text>
<rect x="870.0" y="290.0" width="170.0" height="110.0" rx="6" class="plain"/>
<text x="955.0" y="342.0" class="tb" text-anchor="middle" >readout_counter</text>
<text x="955.0" y="357.0" class="ts" text-anchor="middle" >histogram 4096 × 32</text>
<text x="955.0" y="370.0" class="ts" text-anchor="middle" >(8 BSRAM)</text>
<text x="955.0" y="383.0" class="ts" text-anchor="middle" >+ per-spin counters</text>
<line x1="836.0" y1="349.0" x2="870.0" y2="349.0" class="lk"/>
<polygon points="870.0,349.0 862.0,353.0 862.0,345.0" class="fk"/>
<text x="849.0" y="371.0" class="ts" text-anchor="middle" >sweep_done</text>
<polyline points="955.0,290.0 955.0,140.0 620.0,140.0 620.0,150.0" class="lk"/>
<polygon points="620.0,150.0 616.0,142.0 624.0,142.0" class="fk"/>
<text x="965.0" y="220.0" class="ts" text-anchor="start" >histogram dump</text>
<rect x="870.0" y="420.0" width="170.0" height="60.0" rx="6" class="plain"/>
<text x="955.0" y="447.0" class="tb" text-anchor="middle" >6 LEDs</text>
<text x="955.0" y="462.0" class="ts" text-anchor="middle" >spins 0-4 + busy</text>
<text x="955.0" y="475.0" class="ts" text-anchor="middle" >pins 10-16</text>
<line x1="836.0" y1="365.0" x2="870.0" y2="440.0" class="lk"/>
<polygon points="870.0,440.0 863.1,434.4 870.3,431.1" class="fk"/>
<line x1="336.0" y1="445.0" x2="380.0" y2="445.0" class="lk"/>
<polygon points="380.0,445.0 372.0,449.0 372.0,441.0" class="fk"/>
<text x="358.0" y="439.0" class="ts" text-anchor="middle" >clk</text>
<line x1="336.0" y1="340.0" x2="380.0" y2="340.0" class="lk"/>
<polygon points="380.0,340.0 372.0,344.0 372.0,336.0" class="fk"/>
<text x="358.0" y="334.0" class="ts" text-anchor="middle" >reset / run</text>
<text x="24.0" y="548.0" class="ts" text-anchor="start" >Orange box = the thermodynamic core; everything else is ordinary digital plumbing that plays the role of XTR-0's host + FPGA [SDP p.9 Fig. 6].</text>
</svg>