<text x="580.0" y="96.0" class="ts" text-anchor="start" >sigmoid: input tilts the</text>
<text x="580.0" y="110.0" class="ts" text-anchor="start" >odds (dashed = hotter, low β)</text>
<rect x="24.0" y="150.0" width="230.0" height="40.0" rx="6" class="plain"/>
