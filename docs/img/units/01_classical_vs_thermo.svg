<text x="560.0" y="227.0" class="ts" text-anchor="start" >J, h whose ground states = truth table</text>
<rect x="800.0" y="202.0" width="160.0" height="40.0" rx="6" class="cool"/>
<text x="810.0" y="227.0" class="tms" text-anchor="start" >pgates.v</text>
<rect x="24.0" y="254.0" width="230.0" height="40.0" rx="6" class="plain"/>
<text x="139.0" y="278.0" class="tb" text-anchor="middle" >Comparator</text>
<text x="262.0" y="279.0" class="ts" text-anchor="start" >V &gt; Vref</text>
